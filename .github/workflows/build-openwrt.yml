name: Build OpenWrt for JioFiber JCOW414

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build:
    name: Build JCOW414 Firmware (.trx)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
          sudo apt clean

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone Upstream OpenWrt (main)
        run: |
          git clone --depth=1 -b main https://github.com/openwrt/openwrt.git openwrt

      - name: Disable Video Feed
        working-directory: openwrt
        run: |
          # qt5 Config.in has recursive Kconfig deps that corrupt defconfig
          sed -i.bak 's|^src-git video|#src-git video|' feeds.conf.default

      - name: Update and Install Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply GPON xPON Port Patches
        run: |
          for p in patches/*.patch; do
            [ -e "$p" ] || continue
            echo "Applying $p"
            git -C openwrt apply "$p" || (cd openwrt && patch -p1 < "../$p")
          done

      - name: Inject Custom Configurations & Overlay
        run: |
          # Copy custom overlay files
          if [ -d "files" ]; then
            mkdir -p openwrt/files
            cp -r files/* openwrt/files/
            chmod +x openwrt/files/etc/hotplug.d/block/* || true
            chmod +x openwrt/files/etc/hotplug.d/net/* || true
            chmod +x openwrt/files/etc/hotplug.d/usb/* || true
            chmod +x openwrt/files/etc/init.d/* || true
          fi
          # Copy seed configuration
          cp seed.config openwrt/.config

      - name: Generate Defconfig
        working-directory: openwrt
        run: |
          make defconfig

      - name: Download Sources
        working-directory: openwrt
        run: |
          make download -j8

      - name: Compile OpenWrt Image
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize Firmware Artifacts
        run: |
          mkdir -p release_artifacts
          find openwrt/bin/targets/econet/en7528/ -type f -name "*jiofiber_jcow414*.trx" -exec cp {} release_artifacts/ \;
          cd release_artifacts
          sha256sum *.trx > sha256sums.txt
          echo "Built firmware artifacts:"
          ls -lh

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jcow414-firmware
          path: release_artifacts/*
          retention-days: 30
